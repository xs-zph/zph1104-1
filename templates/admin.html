<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>系统管理员 - AI 工单系统</title>
  <link rel="stylesheet" href="/static/style.css?v=20260904-2" />
</head>
<body class="admin-body">
  <header class="navbar"><div class="navbar-inner">
    <div class="brand"><span class="brand-icon">A</span><span class="brand-name">系统管理员</span></div>
    <div class="navbar-right"><span class="navbar-user" id="admin-username">管理员</span><button class="btn btn-light" id="logout-btn">退出登录</button></div>
  </div></header>
  <main class="container manager-container">
    <section class="manager-intro"><div><p class="eyebrow">账号安全</p><h1>账号与权限</h1><p>管理系统账号、角色、密码和启停用状态。</p></div><button class="btn btn-ghost" id="refresh-accounts-btn">刷新账号</button></section>
    <section class="panel manager-panel account-panel"><div class="panel-head"><div><h2 class="panel-title">账号管理</h2><p class="panel-desc">管理员、经理、客服和客户的权限由服务端执行。</p></div><span class="panel-tip" id="account-count"></span></div>
      <form id="account-form" class="account-form" autocomplete="off"><input type="hidden" id="account-edit-key" /><div class="account-form-grid"><label>用户名<input id="account-username" required placeholder="3-32 位字母、数字或下划线" /></label><label>初始密码<input id="account-password" type="password" required placeholder="至少 8 位，含字母和数字" /></label><label>角色<select id="account-role"><option value="manager">经理</option><option value="agent">客服</option><option value="customer">客户</option><option value="admin">系统管理员</option></select></label></div><div class="permission-picker" id="permission-picker"></div><div class="account-form-actions"><button class="btn btn-primary" id="account-submit-btn">创建账号</button><button type="button" class="btn btn-ghost hidden" id="account-cancel-btn">取消编辑</button></div></form>
      <div id="account-list" class="account-list"><div class="empty">加载中...</div></div>
    </section>
    <section class="panel manager-panel"><div class="panel-head"><h2 class="panel-title">账号变更审计</h2><button class="btn btn-ghost" id="refresh-audits-btn">刷新</button></div><div id="account-audits" class="audit-list"><div class="empty">加载中...</div></div></section>
    <section class="panel manager-panel"><div class="panel-head"><div><h2 class="panel-title">多 Agent 运行审计</h2><p class="panel-desc">仅管理员可查看脱敏后的调度摘要和 JSON 轨迹。</p></div><button class="btn btn-ghost" id="refresh-agent-runs-btn">刷新</button></div><div id="agent-runs" class="agent-run-list"><div class="empty">加载中...</div></div><div id="agent-run-detail" class="agent-run-detail hidden"></div></section>
    <section class="panel manager-panel knowledge-panel"><div class="panel-head"><div><h2 class="panel-title">知识库管理</h2><p class="panel-desc">维护客服可直接引用的政策与流程，保存后立即同步检索库。</p></div><div class="panel-head-right"><span class="panel-tip" id="faq-count"></span><button class="btn btn-ghost" id="refresh-faq-btn" type="button">刷新</button></div></div>
      <form id="faq-form" class="faq-form" autocomplete="off"><input type="hidden" id="faq-edit-key" /><div class="field"><label for="faq-question">客户问题</label><input id="faq-question" required maxlength="500" placeholder="例如：退货需要满足什么条件？" /></div><div class="field"><label for="faq-answer">标准答案</label><textarea id="faq-answer" required maxlength="2000" rows="4" placeholder="填写可直接回复客户的准确答案"></textarea></div><div class="faq-form-actions"><button class="btn btn-primary" id="faq-submit-btn" type="submit">新增知识</button><button class="btn btn-ghost hidden" id="faq-cancel-btn" type="button">取消编辑</button></div></form>
      <div id="faq-list" class="faq-list"><div class="empty">加载中...</div></div><div id="faq-history-detail" class="agent-run-detail hidden"></div>
      <div class="knowledge-import">
        <div class="knowledge-import-head"><div><h3>导入业务文档</h3><p class="panel-desc">支持 PDF、DOCX、Markdown 和 TXT，文本提取后写入文档检索库。</p></div><span class="panel-tip">单文件 10 MB · 不保存原文件</span></div>
        <form id="knowledge-document-form" class="document-upload-form" enctype="multipart/form-data"><label class="document-file"><span>选择文件</span><input type="file" id="knowledge-document-file" accept=".pdf,.docx,.md,.txt" required /></label><button class="btn btn-primary" id="knowledge-upload-btn" type="submit">上传并索引</button></form>
        <div class="document-upload-result hidden" id="knowledge-upload-result"></div>
        <div id="knowledge-document-list" class="document-list"><div class="empty">暂无上传文档</div></div>
      </div>
    </section>
  </main>
  <script src="/static/admin.js?v=20260906-documents"></script>
</body>
</html>
