<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - AI客服工单自动化系统</title>
    <link rel="stylesheet" href="/static/style.css?v=20260903">
</head>
<body class="login-body">
    <main class="login-card">
        <div class="login-logo">
            <div class="login-logo-icon">AI</div>
            <h1>重置密码</h1>
            <p class="login-sub">验证账号后设置新密码</p>
        </div>

        <form id="forgot-password-form" class="login-form" autocomplete="off">
            <div class="field">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required>
            </div>
            <div class="field" id="phone-field">
                <label for="phone">已绑定手机号</label>
                <input type="tel" id="phone" placeholder="请输入 11 位手机号" autocomplete="tel" pattern="1[3-9][0-9]{9}" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="request-reset-btn">获取验证码</button>

            <div id="reset-step" hidden>
                <div class="field">
                    <label for="reset-code">短信验证码</label>
                    <input type="text" id="reset-code" placeholder="请输入 6 位验证码" autocomplete="one-time-code" inputmode="numeric" required>
                </div>
                <div class="field">
                    <label for="password">新密码</label>
                    <input type="password" id="password" placeholder="至少 8 位，包含字母和数字" autocomplete="new-password" required>
                </div>
                <div class="field">
                    <label for="confirm-password">确认新密码</label>
                    <input type="password" id="confirm-password" placeholder="再次输入新密码" autocomplete="new-password" required>
                </div>
                <button type="button" class="btn btn-primary btn-block" id="forgot-password-btn">重置密码</button>
            </div>
            <div class="login-error" id="forgot-password-error" hidden></div>
            <div class="login-success" id="forgot-password-success" hidden></div>
        </form>

        <div class="login-back"><a href="/login">返回登录</a></div>
    </main>

    <script src="/static/forgot_password.js?v=20260903"></script>
</body>
</html>
